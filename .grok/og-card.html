<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #faf6f0;
      }
      body {
        position: relative;
        color: #2c3148;
        font-family: Fredoka, "Nunito", sans-serif;
      }
      .wash {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 58% 72% at 10% 16%, #f6e4e8 0%, transparent 72%),
          radial-gradient(ellipse 48% 62% at 96% 6%, #e4dcf0 0%, transparent 70%),
          radial-gradient(ellipse 42% 55% at 86% 100%, #f6e4e8 0%, transparent 72%),
          radial-gradient(ellipse 36% 48% at 0% 100%, #e4dcf0 0%, transparent 70%),
          #faf6f0;
      }
      .sheet {
        position: absolute;
        left: 120px;
        top: 64px;
        width: 960px;
        height: 502px;
        background: #fffdfb;
        border: 1px solid #eadfe4;
        border-radius: 32px;
        box-shadow: 0 22px 54px rgba(125, 109, 150, 0.13);
      }
      .ribbon {
        position: absolute;
        top: 0;
        right: 108px;
        width: 16px;
        height: 78px;
        background: #c98998;
        border-radius: 0 0 8px 8px;
      }
      .lockup {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 36px 72px 28px;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin-bottom: 6px;
      }
      .kicker {
        margin: 0 0 6px;
        font-family: "Pixelify Sans", sans-serif;
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0.16em;
        color: #a56b7c;
      }
      h1 {
        margin: 0;
        font-weight: 600;
        font-size: 168px;
        line-height: 0.88;
        letter-spacing: -0.02em;
        color: #2c3148;
        text-align: center;
      }
      h1 span { display: block; }
      .rule {
        width: 132px;
        height: 3px;
        margin-top: 22px;
        border-radius: 3px;
        background: #c4a574;
      }
      .star {
        position: absolute;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="wash"></div>

    <svg class="star" style="left: 46px; top: 48px" width="18" height="18" viewBox="0 0 9 9" aria-hidden="true">
      <rect x="4" y="0" width="1" height="9" fill="#c4a574"/>
      <rect x="0" y="4" width="9" height="1" fill="#c4a574"/>
    </svg>
    <svg class="star" style="left: 1128px; top: 72px" width="14" height="14" viewBox="0 0 7 7" aria-hidden="true">
      <rect x="3" y="0" width="1" height="7" fill="#2c3148"/>
      <rect x="0" y="3" width="7" height="1" fill="#2c3148"/>
    </svg>
    <svg class="star" style="left: 36px; top: 292px" width="12" height="12" viewBox="0 0 6 6" aria-hidden="true">
      <rect x="2" y="0" width="2" height="2" fill="#c4a574"/>
      <rect x="0" y="2" width="6" height="2" fill="#c4a574"/>
      <rect x="2" y="4" width="2" height="2" fill="#c4a574"/>
    </svg>
    <svg class="star" style="left: 1104px; top: 340px" width="18" height="18" viewBox="0 0 9 9" aria-hidden="true">
      <rect x="4" y="0" width="1" height="9" fill="#c4a574"/>
      <rect x="0" y="4" width="9" height="1" fill="#c4a574"/>
    </svg>
    <svg class="star" style="left: 78px; top: 540px" width="14" height="14" viewBox="0 0 7 7" aria-hidden="true">
      <rect x="3" y="0" width="1" height="7" fill="#2c3148"/>
      <rect x="0" y="3" width="7" height="1" fill="#2c3148"/>
    </svg>
    <svg class="star" style="left: 1088px; top: 548px" width="12" height="12" viewBox="0 0 6 6" aria-hidden="true">
      <rect x="2" y="0" width="2" height="2" fill="#c98998"/>
      <rect x="0" y="2" width="6" height="2" fill="#c98998"/>
      <rect x="2" y="4" width="2" height="2" fill="#c98998"/>
    </svg>

    <div class="sheet">
      <div class="ribbon"></div>
      <svg class="star" style="left: 48px; top: 46px" width="12" height="12" viewBox="0 0 6 6" aria-hidden="true">
        <rect x="2" y="0" width="2" height="2" fill="#c4a574"/>
        <rect x="0" y="2" width="6" height="2" fill="#c4a574"/>
        <rect x="2" y="4" width="2" height="2" fill="#c4a574"/>
      </svg>
      <svg class="star" style="right: 56px; top: 188px; left: auto" width="12" height="12" viewBox="0 0 6 6" aria-hidden="true">
        <rect x="2" y="0" width="2" height="2" fill="#c4a574"/>
        <rect x="0" y="2" width="6" height="2" fill="#c4a574"/>
        <rect x="2" y="4" width="2" height="2" fill="#c4a574"/>
      </svg>
      <div class="lockup">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="28" cy="34" r="18" fill="#c98998"/>
          <circle cx="36.5" cy="28.5" r="14.2" fill="#fffdfb"/>
          <rect x="46" y="10" width="3" height="3" fill="#c4a574"/>
          <rect x="43" y="13" width="9" height="3" fill="#c4a574"/>
          <rect x="46" y="16" width="3" height="3" fill="#c4a574"/>
        </svg>
        <p class="kicker">a quiet journal</p>
        <h1><span>My Little</span><span>Life</span></h1>
        <div class="rule"></div>
      </div>
    </div>
  </body>
</html>
