<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My Little Life</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@450;560;650&family=Nunito:wght@400;600;700&family=Pixelify+Sans:wght@500&display=swap" />
<style>
:root {
  --ivory:#faf6f0; --paper:#fffdfb; --blush:#f6e4e8; --rose:#c98998; --rose-deep:#a56b7c;
  --lavender:#e4dcf0; --lilac:#7d6d96; --gold:#c4a574; --gold-soft:#efe3cc;
  --ink:#3d3140; --muted:#8a7b86; --night:#2c3148; --line:#eadfe4;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ivory); color: var(--ink); font-family: Nunito, system-ui, sans-serif; }
body {
  background-image:
    radial-gradient(circle at 12% 8%, #f6e4e8cc, transparent 32%),
    radial-gradient(circle at 88% 0%, #e4dcf0b3, transparent 28%);
  min-height: 100vh;
}
button, [role="button"] { cursor: pointer; font-family: inherit; }
input, textarea, select { font-family: inherit; color: inherit; }
.app { max-width: 960px; margin: 0 auto; padding: 16px 12px 80px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 10px 28px #7d6d9614; padding: 16px 18px; margin-bottom: 14px; }
.kicker { font-family: "Pixelify Sans", system-ui, sans-serif; letter-spacing: .08em; color: var(--rose-deep); font-size: .78rem; margin: 0 0 4px; }
h1 { font-family: Fredoka, Nunito, sans-serif; font-weight: 500; font-size: 1.8rem; color: var(--night); margin: 0; }
h2 { font-family: Fredoka, Nunito, sans-serif; font-weight: 500; font-size: 1.2rem; margin: 0 0 10px; color: var(--ink); }
header.card { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
nav button, .btn {
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  border-radius: 999px; min-height: 40px; padding: 8px 14px; font-size: .88rem;
}
nav button.on, .btn.solid { background: var(--night); color: var(--ivory); border-color: var(--night); }
.btn.blush { background: var(--blush); }
.grid2 { display: grid; gap: 12px; }
@media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 640px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { background: #f6e4e8b3; border-radius: 16px; padding: 10px 12px; }
.stat b { display: block; font-family: Fredoka, sans-serif; font-size: 1.4rem; color: var(--night); font-weight: 500; }
.stat span, .hint { color: var(--muted); font-size: .8rem; }
label { display: block; color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
input[type="text"], input[type="number"], input[type="date"], textarea, select {
  width: 100%; margin-top: 4px; border: 1px solid var(--line); background: var(--ivory);
  border-radius: 12px; padding: 10px 12px; font-size: .92rem; outline: none;
}
textarea { min-height: 90px; resize: vertical; }
.item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.box { width: 26px; height: 26px; border: 2px solid var(--rose); border-radius: 8px; background: var(--paper); flex-shrink: 0; }
.box.on { background: var(--lilac); border-color: var(--lilac); }
.box.on::after { content: ""; display: block; width: 8px; height: 8px; margin: 7px auto; background: var(--paper); border-radius: 2px; }
.item span { flex: 1; font-size: .92rem; }
.item.done span { color: var(--muted); text-decoration: line-through; }
.add { display: flex; gap: 8px; margin-top: 8px; }
.add input { margin: 0; flex: 1; }
.bar { height: 8px; background: var(--lavender); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--rose); }
table { width: 100%; border-collapse: collapse; font-size: .85rem; }
th, td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.pill { border-radius: 999px; border: 1px solid var(--line); background: var(--paper); min-height: 40px; padding: 8px 12px; }
.pill.on { background: var(--blush); border-color: var(--rose); }
.days { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 800px) { .days { grid-template-columns: repeat(7, 1fr); } }
.day { border: 1px solid var(--line); border-radius: 14px; padding: 8px; min-height: 72px; background: var(--paper); }
.day.today { background: var(--blush); border-color: var(--rose); }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--night); color: var(--ivory); border-radius: 999px; padding: 8px 16px; display: none; }
.hidden { display: none; }
.tiny { font-size: .75rem; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header class="card">
    <div>
      <p class="kicker">a little journal</p>
      <h1>My Little Life</h1>
      <p class="hint">Graduate in 2028. Learn the work. Keep your money. Leave room to live.</p>
    </div>
    <div class="row">
      <button class="btn" id="backup">Backup</button>
      <label class="btn blush" style="display:inline-flex;align-items:center">Restore
        <input id="restore" type="file" accept="application/json" hidden />
      </label>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
const KEY = "my-little-life-html-v1";
const SALAH = ["Fajr","Dhuhr","Asr","Maghrib","Isha"];
const GRADES = ["A","A-","B+","B","B-","C+","C","C-","D+","D","F"];
const POINTS = {"A":4,"A-":3.7,"B+":3.3,"B":3,"B-":2.7,"C+":2.3,"C":2,"C-":1.7,"D+":1.3,"D":1,"F":0};
const TABS = [["today","Today"],["week","Week"],["month","Month"],["uni","University"],["ai","AI path"],["work","Work"],["money","Money"],["move","Independence"],["future","Future"],["faith","Faith"],["care","Care"],["habits","Habits"],["notes","Notes"]];
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);
function seed() {
  return {
    tab: "today",
    priorities: [], todos: [], notes: "", mood: 0, energy: 0,
    courses: [
      {id:uid(), name:"Operating Systems", credits:3, semester:"Current", grade:"", lectures:"", backlog:true},
      {id:uid(), name:"Statistical Methods", credits:3, semester:"Current", grade:"", lectures:"", backlog:true}
    ],
    tasks: [], study: [
      {id:uid(), day:"Sunday", time:"Evening", focus:"Hard course, 50 minutes"},
      {id:uid(), day:"Tuesday", time:"Afternoon", focus:"Statistics practice"}
    ],
    grad: "Alexandria University, Computer Science, Statistics minor. Graduation 2028. CGPA target 3.33.",
    roadmap: [
      ["Foundations","Python"],["Foundations","Mathematics for ML"],["Foundations","Statistics"],
      ["CS","Data structures and algorithms"],["Data","SQL"],["Tools","Git and GitHub"],
      ["ML","Machine learning"],["ML","Deep learning"],["ML","NLP"],["Build","APIs and a small deployment"],
      ["Course","Xperience AI — compare, then decide"],["Proof","Three portfolio projects"]
    ].map(([area,title]) => ({id:uid(), area, title, status:"later", notes:""})),
    github: "", portfolio: "", compare: "Xperience AI: price, hours per week, projects, and whether it fits the semester.",
    projects: [], certs: [], apps: [{id:uid(), place:"Sutherland", role:"Wayfair account", status:"Exploring", notes:"Must fit lectures."}],
    work: "", shifts: "", salary: "", fit: "",
    egp: 0, usd: 0, ledger: [], budget: "",
    funds: {emergency:0, moving:0, travel:0},
    moving: [{id:uid(), text:"Know a realistic monthly cost", done:false},{id:uid(), text:"Save before signing anything", done:false}],
    costs: "", housing: "", places: [], live: [], experiences: [], lifestyle: "A quiet place, steady income, room to study, and travel when it is affordable.",
    salah: {}, quran: 0, quranWhere: "",
    skin: {}, hair: "", sleep: "",
    workoutStart: today(), workout: {},
    habits: [{id:uid(), name:"One focused study block"},{id:uid(), name:"Skincare, gently"},{id:uid(), name:"Lights out on time"}],
    habitToday: [],
    morning: [{id:uid(), text:"Water", done:false},{id:uid(), text:"Three priorities", done:false}],
    evening: [{id:uid(), text:"Skincare", done:false},{id:uid(), text:"Isha", done:false}],
    events: [], goals: [], brain: "", reading: [], ideas: []
  };
}
let S = load();
function load() {
  try { const r = localStorage.getItem(KEY); if (r) return Object.assign(seed(), JSON.parse(r)); } catch (e) {}
  return seed();
}
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.style.display = "block"; setTimeout(() => t.style.display = "none", 1600); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&","<":"<",">":">","\"":""","'":"&#39;" }[c])); }
function cgpa() {
  let p = 0, c = 0;
  S.courses.forEach(x => { if (POINTS[x.grade] != null && x.credits > 0) { p += POINTS[x.grade] * Number(x.credits); c += Number(x.credits); } });
  return c ? (p / c) : null;
}
function setsFor() {
  const a = new Date(S.workoutStart + "T12:00:00").getTime();
  const b = new Date(today() + "T12:00:00").getTime();
  return Math.floor((b - a) / 86400000) >= 14 ? 2 : 1;
}
function planToday() {
  const d = new Date().getDay();
  if (d === 1 || d === 6) return { name: "Glutes, core, calves", moves: ["Glute bridges","Seated band abductions","Heel slides","Dead bugs","Seated calf raises"] };
  if (d === 3) return { name: "Arms and core", moves: ["Seated dumbbell curls","Seated shoulder raises","Triceps extensions","Supported kickbacks","Gentle core"] };
  return null;
}
function suggestSkin() {
  const d = new Date(); d.setDate(d.getDate() - 1);
  const prev = (S.skin[d.toISOString().slice(0,10)] || {}).night;
  return prev === "acretin" ? "recovery" : prev === "recovery" ? "acretin" : "recovery";
}

function list(items, onToggle, onRemove, placeholder, onAdd) {
  return `<div>${items.map((it,i) => `<div class="item ${it.done ? "done" : ""}">
    <button class="box ${it.done ? "on" : ""}" data-act="tog" data-i="${i}"></button>
    <span>${esc(it.text || it.name)}</span>
    <button class="tiny" data-act="rm" data-i="${i}">Remove</button></div>`).join("") || `<p class="hint">Nothing here yet.</p>`}
    <form class="add" data-add="1"><input name="t" placeholder="${esc(placeholder)}" /><button class="btn solid" type="submit">Add</button></form></div>`;
}
function bindList(root, items, mutate) {
  root.querySelectorAll("[data-act=tog]").forEach(b => b.onclick = () => { items[+b.dataset.i].done = !items[+b.dataset.i].done; mutate(); });
  root.querySelectorAll("[data-act=rm]").forEach(b => b.onclick = () => { items.splice(+b.dataset.i, 1); mutate(); });
  const f = root.querySelector("[data-add]");
  if (f) f.onsubmit = e => { e.preventDefault(); const t = new FormData(f).get("t").trim(); if (!t) return; items.push({ id: uid(), text: t, done: false, name: t }); mutate(); };
}

const views = {
  today() {
    const g = cgpa();
    const prayers = SALAH.filter(n => (S.salah[today()] || {})[n]).length;
    const priDone = S.priorities.filter(p => p.done).length;
    const score = Math.round(((S.priorities.length ? priDone / S.priorities.length : 0) + (S.habits.length ? S.habitToday.length / S.habits.length : 0) + prayers / 5) / 3 * 100);
    const plan = planToday();
    return `<section class="card"><p class="kicker">today</p><h2>${new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</h2>
      <div class="stats">
        <div class="stat"><span>Today</span><b>${score}%</b></div>
        <div class="stat"><span>CGPA</span><b>${g ? g.toFixed(2) : "—"}</b><span>aim 3.33</span></div>
        <div class="stat"><span>Salah</span><b>${prayers}/5</b></div>
        <div class="stat"><span>Open uni</span><b>${S.tasks.filter(t=>!t.done).length}</b></div>
      </div>
      <div class="bar"><i style="width:${score}%"></i></div>
      <p class="hint">Only what is in front of you.</p>
    </section>
    <div class="grid2">
      <section class="card" id="pri"><h2>Three priorities</h2>${list(S.priorities,1,1,"One thing that matters")}</section>
      <section class="card" id="todo"><h2>To-do</h2>${list(S.todos,1,1,"A small task")}</section>
    </div>
    <section class="card"><h2>Notes</h2><textarea id="notes">${esc(S.notes)}</textarea>
      <p class="hint" style="margin-top:10px">${plan ? `Workout: ${plan.name}, about 15–25 minutes, ${setsFor()} set. ` : "Rest day. Missing a workout is not a failure. "}Skin suggestion: ${suggestSkin() === "acretin" ? "Acretin 0.05% if skin is calm" : "recovery night"}.</p>
    </section>
    <section class="card"><h2>Mood and energy</h2>
      <p class="hint">Mood</p><div class="row" id="mood">${[1,2,3,4,5].map(n=>`<button class="pill ${S.mood===n?"on":""}" data-m="${n}">${n}</button>`).join("")}</div>
      <p class="hint">Energy</p><div class="row" id="energy">${[1,2,3,4,5].map(n=>`<button class="pill ${S.energy===n?"on":""}" data-e="${n}">${n}</button>`).join("")}</div>
    </section>`;
  },
  week() { return cal("week"); },
  month() { return cal("month"); },
  uni() {
    const g = cgpa();
    return `<section class="card"><p class="kicker">alexandria university</p><h2>Courses</h2>
      <div class="stats"><div class="stat"><span>CGPA</span><b>${g?g.toFixed(2):"—"}</b></div><div class="stat"><span>Target</span><b>3.33</b></div><div class="stat"><span>Graduation</span><b>2028</b></div></div>
      <p class="hint">Computer Science, Statistics minor. Blank grades stay out of the average.</p>
      <div style="overflow:auto"><table><tr><th>Course</th><th>Cr</th><th>Grade</th><th>Hard</th><th></th></tr>
      ${S.courses.map((c,i)=>`<tr><td><input data-c="name" data-i="${i}" value="${esc(c.name)}"/></td>
        <td><input data-c="credits" data-i="${i}" type="number" value="${c.credits}" style="width:64px"/></td>
        <td><select data-c="grade" data-i="${i}"><option value=""></option>${GRADES.map(g=>`<option ${c.grade===g?"selected":""}>${g}</option>`).join("")}</select></td>
        <td><input type="checkbox" data-c="backlog" data-i="${i}" ${c.backlog?"checked":""}/></td>
        <td><button data-c="rm" data-i="${i}">Remove</button></td></tr>`).join("")}
      </table></div>
      <form class="add" id="addCourse"><input name="name" placeholder="Course" required/><input name="cr" type="number" value="3" style="max-width:70px"/><button class="btn solid">Add</button></form>
    </section>
    <section class="card"><h2>Backlog</h2>${S.courses.filter(c=>c.backlog).map(c=>`<p><b>${esc(c.name)}</b><br><span class="hint">Short sessions. One problem set is a real win.</span></p>`).join("") || `<p class="hint">Mark a course as hard.</p>`}</section>
    <section class="card" id="tasks"><h2>Assignments and exams</h2>
      ${S.tasks.map((t,i)=>`<div class="item ${t.done?"done":""}"><button class="box ${t.done?"on":""}" data-t="${i}"></button><span>${esc(t.kind)} · ${esc(t.title)} · ${esc(t.due)}</span><button data-tr="${i}" class="tiny">Remove</button></div>`).join("")}
      <form class="add" id="addTask"><input name="title" placeholder="Title"/><input name="due" type="date"/><select name="kind"><option>assignment</option><option>exam</option><option>quiz</option><option>project</option></select><button class="btn solid">Add</button></form>
    </section>
    <section class="card"><h2>Graduation notes</h2><textarea id="grad">${esc(S.grad)}</textarea></section>`;
  },
  ai() {
    const done = S.roadmap.filter(r => r.status === "done").length;
    return `<section class="card"><p class="kicker">toward an ai engineer</p><h2>Roadmap · ${done}/${S.roadmap.length}</h2>
      ${S.roadmap.map((r,i)=>`<div class="item"><span><span class="tiny">${esc(r.area)}</span><br>${esc(r.title)}</span>
        <select data-r="${i}">${["later","now","done"].map(s=>`<option ${r.status===s?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")}
    </section>
    <section class="card"><h2>Course comparison</h2><textarea id="compare">${esc(S.compare)}</textarea></section>
    <section class="card" id="projects"><h2>Projects</h2>${list(S.projects,1,1,"A project")}</section>
    <section class="card"><h2>GitHub and portfolio</h2>
      <label>GitHub<input id="github" value="${esc(S.github)}" placeholder="github.com/you"/></label>
      <label>Portfolio<textarea id="portfolio">${esc(S.portfolio)}</textarea></label>
    </section>`;
  },
  work() {
    return `<section class="card"><h2>Work while studying</h2>
      <label>Status<textarea id="work">${esc(S.work)}</textarea></label>
      <label>Shifts<textarea id="shifts">${esc(S.shifts)}</textarea></label>
      <label>Pay<textarea id="salary">${esc(S.salary)}</textarea></label>
      <label>Does it fit university?<textarea id="fit">${esc(S.fit)}</textarea></label>
    </section>
    <section class="card" id="apps"><h2>Applications</h2>
      ${S.apps.map((a,i)=>`<div class="item"><span>${esc(a.place)} · ${esc(a.role)} · ${esc(a.status)}</span><button data-ar="${i}" class="tiny">Remove</button></div>`).join("")}
      <form class="add" id="addApp"><input name="place" placeholder="Place"/><input name="role" placeholder="Role"/><button class="btn solid">Add</button></form>
    </section>`;
  },
  money() {
    return `<section class="card"><h2>Balances</h2>
      <div class="grid2"><label>EGP<input id="egp" type="number" value="${S.egp}"/></label><label>USD<input id="usd" type="number" value="${S.usd}"/></label></div>
      <div class="stats" style="margin-top:8px">
        <div class="stat"><span>Emergency</span><b>${S.funds.emergency}</b></div>
        <div class="stat"><span>Moving-out</span><b>${S.funds.moving}</b></div>
        <div class="stat"><span>Travel</span><b>${S.funds.travel}</b></div>
      </div>
      <div class="grid2" style="margin-top:8px">
        <label>Emergency fund (EGP)<input id="f-emergency" type="number" value="${S.funds.emergency}"/></label>
        <label>Moving-out fund<input id="f-moving" type="number" value="${S.funds.moving}"/></label>
        <label>Travel fund<input id="f-travel" type="number" value="${S.funds.travel}"/></label>
      </div>
      <label>Budget notes<textarea id="budget">${esc(S.budget)}</textarea></label>
    </section>`;
  },
  move() {
    return `<section class="card" id="moving"><h2>Moving-out checklist</h2>${list(S.moving,1,1,"A preparation step")}</section>
      <section class="card"><label>Living costs<textarea id="costs">${esc(S.costs)}</textarea></label>
      <label>Housing research<textarea id="housing">${esc(S.housing)}</textarea></label></section>`;
  },
  future() {
    return `<section class="card"><label>The life you are building<textarea id="life">${esc(S.lifestyle)}</textarea></label></section>
      <section class="card" id="places"><h2>Places to visit</h2>${list(S.places,1,1,"A place")}</section>
      <section class="card" id="live"><h2>Where you might live</h2>${list(S.live,1,1,"A city or country")}</section>
      <section class="card" id="exp"><h2>Experiences</h2>${list(S.experiences,1,1,"Something you want to have done")}</section>`;
  },
  faith() {
    const day = S.salah[today()] || {};
    return `<section class="card"><h2>Salah</h2><div class="row">${SALAH.map(n=>`<button class="pill ${day[n]?"on":""}" data-salah="${n}">${n}<br><span class="tiny">${day[n]?"Kept":"Open"}</span></button>`).join("")}</div></section>
      <section class="card"><label>Pages today<input id="quran" type="number" value="${S.quran}"/></label>
      <label>Where you are<input id="qwhere" value="${esc(S.quranWhere)}"/></label></section>`;
  },
  care() {
    const sk = S.skin[today()] || { night:"", cleanser:false, shave:false, moisturizer:false, sunscreen:false };
    const plan = planToday();
    const nights = [];
    for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate()-i); const k = d.toISOString().slice(0,10); nights.push({k, n:(S.skin[k]||{}).night||""}); }
    return `<section class="card"><h2>Tonight</h2><p class="hint">Suggested: ${suggestSkin()==="acretin"?"Acretin 0.05% if calm":"recovery"}. Do not stack active nights.</p>
      <div class="row">${[["acretin","Acretin 0.05%"],["recovery","Recovery"],["off","Skip"]].map(([id,l])=>`<button class="pill ${sk.night===id?"on":""}" data-night="${id}">${l}</button>`).join("")}</div>
      <div class="row" style="margin-top:8px">${[["cleanser","Dermaelle cleanser"],["moisturizer","Moisturizer"],["sunscreen","Sunscreen"],["shave","Shaving"]].map(([id,l])=>`<button class="pill ${sk[id]?"on":""}" data-skin="${id}">${l}</button>`).join("")}</div>
    </section>
    <section class="card"><h2>Fourteen nights</h2><div class="days">${nights.map(n=>`<div class="day ${n.k===today()?"today":""}"><span class="tiny">${n.k.slice(8)}</span><b>${n.n==="acretin"?"A":n.n==="recovery"?"R":n.n==="off"?"–":"·"}</b></div>`).join("")}</div>
    <p class="tiny">A is Acretin. R is recovery.</p></section>
    <section class="card"><h2>Hair and sleep</h2><label>Hair<textarea id="hair">${esc(S.hair)}</textarea></label><label>Sleep<input id="sleep" value="${esc(S.sleep)}"/></label></section>
    <section class="card"><h2>Workout · ${setsFor()} set</h2>
      ${plan ? `<p>${plan.name}, 15–25 minutes.</p><ul>${plan.moves.map(m=>`<li>${m}</li>`).join("")}</ul>
        <button class="pill ${S.workout[today()]?"on":""}" id="wdone">${S.workout[today()]?"Session kept":"Mark session kept"}</button>`
        : `<p>Rest day. Monday and Saturday are glutes, core, and calves. Wednesday is arms and core.</p>`}
      <p class="tiny">Stay at one set until two weeks feel comfortable. Change is in the start date stored with your backup.</p>
    </section>`;
  },
  habits() {
    return `<section class="card" id="habits"><h2>Today's habits</h2>
      ${S.habits.map(h=>`<div class="item"><button class="box ${S.habitToday.includes(h.id)?"on":""}" data-h="${h.id}"></button><span>${esc(h.name)}</span><button class="tiny" data-hr="${h.id}">Remove</button></div>`).join("")}
      <form class="add" id="addHabit"><input name="t" placeholder="New habit"/><button class="btn solid">Add</button></form>
    </section>
    <div class="grid2"><section class="card" id="morning"><h2>Morning</h2>${list(S.morning,1,1,"A morning step")}</section>
    <section class="card" id="evening"><h2>Evening</h2>${list(S.evening,1,1,"An evening step")}</section></div>`;
  },
  notes() {
    return `<section class="card"><h2>Brain dump</h2><textarea id="brain">${esc(S.brain)}</textarea></section>
      <section class="card" id="ideas"><h2>Ideas</h2>${list(S.ideas,1,1,"An idea")}</section>
      <section class="card" id="reading"><h2>Reading</h2>${list(S.reading,1,1,"A book")}</section>`;
  }
};

function cal(mode) {
  const days = [];
  const now = new Date();
  if (mode === "week") {
    const start = new Date(now); const dow = (start.getDay() + 1) % 7; start.setDate(start.getDate() - dow);
    for (let i = 0; i < 7; i++) { const d = new Date(start); d.setDate(start.getDate()+i); days.push(d); }
  } else {
    const end = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    for (let i = 1; i <= end; i++) days.push(new Date(now.getFullYear(), now.getMonth(), i));
  }
  return `<section class="card"><h2>${mode === "week" ? "This week" : now.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</h2>
    <div class="days">${days.map(d => {
      const k = d.toISOString().slice(0,10);
      const ev = S.events.filter(e => e.date === k);
      return `<div class="day ${k===today()?"today":""}"><span class="tiny">${d.toLocaleDateString("en-GB",{weekday:"short"})} ${d.getDate()}</span>${ev.map(e=>`<div class="tiny">${esc(e.title)}</div>`).join("")}</div>`;
    }).join("")}</div>
    <form class="add" id="addEv"><input name="date" type="date" required/><input name="title" placeholder="What"/><button class="btn solid">Add</button></form>
    </section><section class="card" id="goals"><h2>${mode==="week"?"Weekly":"Monthly"} goals</h2>${list(S.goals,1,1,"A goal")}</section>`;
}

function render() {
  document.getElementById("nav").innerHTML = TABS.map(([id,label]) => `<button class="${S.tab===id?"on":""}" data-tab="${id}">${label}</button>`).join("");
  document.getElementById("main").innerHTML = views[S.tab]();
  wire();
  save();
}
function wire() {
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
  const bind = (id, arr) => { const el = document.getElementById(id); if (el) bindList(el, arr, render); };
  bind("pri", S.priorities); bind("todo", S.todos); bind("projects", S.projects);
  bind("moving", S.moving); bind("places", S.places); bind("live", S.live); bind("exp", S.experiences);
  bind("morning", S.morning); bind("evening", S.evening); bind("ideas", S.ideas); bind("reading", S.reading); bind("goals", S.goals);
  const notes = document.getElementById("notes"); if (notes) notes.oninput = () => { S.notes = notes.value; save(); };
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { S.mood = +b.dataset.m; render(); });
  document.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { S.energy = +b.dataset.e; render(); });
  document.querySelectorAll("[data-c]").forEach(el => {
    const i = +el.dataset.i;
    const ev = el.dataset.c === "backlog" ? "change" : "input";
    if (el.dataset.c === "rm") el.onclick = () => { S.courses.splice(i,1); render(); };
    else el.addEventListener(ev, () => {
      if (el.dataset.c === "backlog") S.courses[i].backlog = el.checked;
      else if (el.dataset.c === "credits") S.courses[i].credits = Number(el.value)||0;
      else S.courses[i][el.dataset.c] = el.value;
      save();
    });
  });
  const ac = document.getElementById("addCourse");
  if (ac) ac.onsubmit = e => { e.preventDefault(); const fd = new FormData(ac); S.courses.push({id:uid(), name:fd.get("name"), credits:Number(fd.get("cr")||3), semester:"Current", grade:"", lectures:"", backlog:false}); render(); };
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { S.tasks[+b.dataset.t].done = !S.tasks[+b.dataset.t].done; render(); });
  document.querySelectorAll("[data-tr]").forEach(b => b.onclick = () => { S.tasks.splice(+b.dataset.tr,1); render(); });
  const at = document.getElementById("addTask");
  if (at) at.onsubmit = e => { e.preventDefault(); const fd = new FormData(at); const title = String(fd.get("title")||"").trim(); if (!title) return; S.tasks.push({id:uid(), title, due:fd.get("due")||"", kind:fd.get("kind"), done:false}); render(); };
  const grad = document.getElementById("grad"); if (grad) grad.oninput = () => { S.grad = grad.value; save(); };
  document.querySelectorAll("[data-r]").forEach(s => s.onchange = () => { S.roadmap[+s.dataset.r].status = s.value; save(); render(); });
  ["compare","github","portfolio","work","shifts","salary","fit","budget","costs","housing","life","hair","sleep","brain","quran","qwhere"].forEach(id => {
    const el = document.getElementById(id); if (!el) return;
    el.oninput = () => {
      const map = {compare:"compare", github:"github", portfolio:"portfolio", work:"work", shifts:"shifts", salary:"salary", fit:"fit", budget:"budget", costs:"costs", housing:"housing", life:"lifestyle", hair:"hair", sleep:"sleep", brain:"brain", qwhere:"quranWhere"};
      if (id === "quran") S.quran = Number(el.value)||0; else S[map[id]] = el.value; save();
    };
  });
  ["egp","usd"].forEach(id => { const el = document.getElementById(id); if (el) el.oninput = () => { S[id] = Number(el.value)||0; save(); }; });
  ["emergency","moving","travel"].forEach(k => { const el = document.getElementById("f-"+k); if (el) el.oninput = () => { S.funds[k] = Number(el.value)||0; save(); }; });
  document.querySelectorAll("[data-salah]").forEach(b => b.onclick = () => {
    const d = S.salah[today()] || {}; d[b.dataset.salah] = !d[b.dataset.salah]; S.salah[today()] = d; render();
  });
  document.querySelectorAll("[data-night]").forEach(b => b.onclick = () => {
    const d = S.skin[today()] || {}; d.night = b.dataset.night; S.skin[today()] = d; render();
  });
  document.querySelectorAll("[data-skin]").forEach(b => b.onclick = () => {
    const d = Object.assign({night:"",cleanser:false,shave:false,moisturizer:false,sunscreen:false}, S.skin[today()]);
    d[b.dataset.skin] = !d[b.dataset.skin]; S.skin[today()] = d; render();
  });
  const wd = document.getElementById("wdone"); if (wd) wd.onclick = () => { S.workout[today()] = !S.workout[today()]; render(); };
  document.querySelectorAll("[data-h]").forEach(b => b.onclick = () => {
    const id = b.dataset.h; S.habitToday = S.habitToday.includes(id) ? S.habitToday.filter(x => x !== id) : S.habitToday.concat(id); render();
  });
  document.querySelectorAll("[data-hr]").forEach(b => b.onclick = () => { S.habits = S.habits.filter(h => h.id !== b.dataset.hr); render(); });
  const ah = document.getElementById("addHabit");
  if (ah) ah.onsubmit = e => { e.preventDefault(); const t = new FormData(ah).get("t").trim(); if (!t) return; S.habits.push({id:uid(), name:t}); render(); };
  const ae = document.getElementById("addEv");
  if (ae) ae.onsubmit = e => { e.preventDefault(); const fd = new FormData(ae); S.events.push({id:uid(), date:fd.get("date"), title:fd.get("title")}); render(); };
  const aa = document.getElementById("addApp");
  if (aa) aa.onsubmit = e => { e.preventDefault(); const fd = new FormData(aa); S.apps.push({id:uid(), place:fd.get("place"), role:fd.get("role"), status:"Open", notes:""}); render(); };
  document.querySelectorAll("[data-ar]").forEach(b => b.onclick = () => { S.apps.splice(+b.dataset.ar,1); render(); });
  if (S.priorities.length > 3) S.priorities = S.priorities.slice(0, 3);
}
document.getElementById("backup").onclick = () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "my-little-life-backup.json"; a.click();
  toast("Backup downloaded");
};
document.getElementById("restore").onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { try { S = Object.assign(seed(), JSON.parse(reader.result)); save(); render(); toast("Restored"); } catch (err) { toast("Could not read that file"); } };
  reader.readAsText(file);
};
render();
</script>
</body>
</html>
